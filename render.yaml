# Free-tier public demo (single container: React SPA + FastAPI + SQLite, synthetic data
# re-seeded on every boot). The full production blueprint with PostgreSQL is in
# render.production.yaml.
services:
  - type: web
    name: sentinelchain-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.space
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: showcase
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: IMPORT_HMAC_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: GROQ_API_KEY      # optional: enables LLM guidance; deterministic without it
        sync: false
